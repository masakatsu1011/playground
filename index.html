<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
        }
        header {
            background: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }
        section {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }
        h2 {
            border-left: 4px solid #333;
            padding-left: 10px;
        }
        .works {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .work-item {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<header>
    <h1>My Portfolio</h1>
    <p>Web Developer / Designer</p>
</header>

<section>
    <h2>About Me</h2>
    <p>ここに自己紹介文を入れます。スキルや経歴、得意分野などを書いてください。</p>
</section>

<section>
    <h2>Works</h2>
    <div class="works">
        <div class="work-item">
            <h3>作品タイトル 1</h3>
            <p>作品の説明をここに書きます。</p>
        </div>
        <div class="work-item">
            <h3>作品タイトル 2</h3>
            <p>作品の説明をここに書きます。</p>
        </div>
        <div class="work-item">
            <h3>作品タイトル 3</h3>
            <p>作品の説明をここに書きます。</p>
        </div>
    </div>
</section>

<section>
    <h2>Contact</h2>
    <p>Email: yourmail@example.com</p>
</section>

</body>
</html>

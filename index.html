<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
        }
        header {
            background: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }
        nav {
            background: #444;
            padding: 10px;
            text-align: center;
        }
        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }
        section {
            padding: 40px;
            max-width: 900px;
            margin: auto;
            background: white;
            margin-top: 20px;
            border-radius: 8px;
        }
        h2 {
            border-left: 5px solid #333;
            padding-left: 10px;
        }
        .works img {
            width: 100%;
            border-radius: 8px;
            margin-top: 10px;
        }
        footer {
            text-align: center;
            padding: 20px;
            background: #333;
            color: white;
            margin-top: 40px;
        }
    </style>
</head>
<body>

<header>
    <h1>My Portfolio</h1>
    <p>Web Developer / Designer</p>
</header>

<nav>
    <a href="#about">About</a>
    <a href="#works">Works</a>
    <a href="#contact">Contact</a>
</nav>

<section id="about">
    <h2>About Me</h2>
    <p>ここに自己紹介を書きます。スキルや経歴、得意分野などを簡潔にまとめると良いです。</p>
</section>

<section id="works" class="works">
    <h2>Works</h2>
    <p>制作した作品を紹介します。</p>

    <h3>作品タイトル 1</h3>
    <img src="sample1.jpg" alt="作品1">

    <h3>作品タイトル 2</h3>
    <img src="sample2.jpg" alt="作品2">
</section>

<section id="contact">
    <h2>Contact</h2>
    <p>メール: yourmail@example.com</p>
    <p>GitHub: <a href="https://github.com/yourname" target="_blank">yourname</a></p>
</section>

<footer>
    © 2026 My Portfolio
</footer>

</body>
</html>
